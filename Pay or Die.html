<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay or Die</title>
<style>
:root{
  --bg:#2a2a22; --frame:#3d2a1f; --btn:rgba(61,42,31,.78); --btnEdge:#8b6040; --btnText:#f2ead2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141317; } }
:root[data-theme="dark"]{ --bg:#141317; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--bg); overflow:hidden; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
#wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
canvas{ display:block; image-rendering:pixelated; image-rendering:crisp-edges; box-shadow:0 0 0 4px var(--frame); max-width:100%; cursor:crosshair; outline:none; }
#touch{ display:none; position:absolute; inset:0; pointer-events:none; }
#touch.on{ display:block; }
#touch button{ pointer-events:auto; position:absolute; background:var(--btn); color:var(--btnText);
  border:2px solid var(--btnEdge); font:bold 18px/1 monospace; border-radius:6px; touch-action:none; }
#touch button:active,#touch button.down{ background:#8b6040; }
.dp{ width:52px; height:52px; }
#bU{ left:66px; bottom:126px; } #bD{ left:66px; bottom:18px; }
#bL{ left:12px; bottom:72px; }  #bR{ left:120px; bottom:72px; }
#bA{ right:16px; bottom:60px; width:68px; height:68px; border-radius:50%; font-size:22px; }
#bB{ right:94px; bottom:24px; width:56px; height:56px; border-radius:50%; }
#bP{ right:12px; top:calc(12px + env(safe-area-inset-top,0px)); width:44px; height:36px; font-size:14px; }
#bM{ right:62px; top:calc(12px + env(safe-area-inset-top,0px)); width:44px; height:36px; font-size:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270" tabindex="0" aria-label="Pay or Die game"></canvas>
  <div id="touch">
    <button class="dp" id="bU" data-k="up">&#9650;</button>
    <button class="dp" id="bD" data-k="down">&#9660;</button>
    <button class="dp" id="bL" data-k="left">&#9664;</button>
    <button class="dp" id="bR" data-k="right">&#9654;</button>
    <button id="bA" data-k="a">A</button>
    <button id="bB" data-k="b">B</button>
    <button id="bP" data-k="pause">II</button>
    <button id="bM" data-k="mute">&#9835;</button>

  cvs.style.width = (W * s) + 'px';

}

function rawText(str, x, y, col, s) {
  ctx.fillStyle = PAL[col];
  let cx = x;
  for (const ch of str) {
    const g = FONT[ch];
    if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') ctx.fillRect(cx + (i % 3) * s, y + ((i / 3) | 0) * s, s, s);
    cx += 4 * s;
  }
}
function text(str, x, y, col = 16, s = 1, shadow = true) {
  str = String(str).toUpperCase();
  if (shadow) rawText(str, x + s, y + s, 1, s);
  rawText(str, x, y, col, s);
}
function textW(str, s = 1) { return String(str).length * 4 * s - s; }
function textC(str, y, col = 16, s = 1, shadow = true) { text(str, Math.round((W - textW(str, s)) / 2), y, col, s, shadow); }

/* =========================================================

function makeSprite(rows, swap) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = newCanvas(w, h), c = cv.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    let ch = rows[y][x];
    if (swap && swap[ch]) ch = swap[ch];
    const i = CH[ch];
    if (!i) continue;
    c.fillStyle = PAL[i]; c.fillRect(x, y, 1, 1);
  }
  return cv;
}
function flip(src) {
  const o = newCanvas(src.width, src.height), c = o.getContext('2d');
  c.translate(src.width, 0); c.scale(-1, 1); c.drawImage(src, 0, 0);
  return o;
}

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function grassInto(c, seed) {
  const r = rng(seed);
  rr(c, 0, 0, 16, 16, 6);
  for (let i = 0; i < 22; i++) rr(c, (r() * 16) | 0, (r() * 16) | 0, 1, 1, r() < 0.6 ? 5 : 7);
  for (let i = 0; i < 2; i++) {
    const x = 2 + ((r() * 11) | 0), y = 4 + ((r() * 9) | 0);
    rr(c, x, y, 1, 2, 5); rr(c, x + 2, y, 1, 2, 5); rr(c, x + 1, y + 1, 1, 2, 5); rr(c, x + 1, y, 1, 1, 7);
  }
}

    musicNext = AC.currentTime + 0.1;
  } catch (e) { AC = null; }

function toneAt(f, t, d, type = 'square', v = 0.12, slide = 0) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();

  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}

    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + d + 0.02);
}

let mode = 'title';
let S = null;           // run state
let titleMap = null;
let frameT = 0, shakeT = 0, shakeMag = 0;

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function buildMap() {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) {
      const edge = r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1;

  for (let c = 25; c <= 28; c++) { g[4][c].type = 'path'; g[10][c].type = 'path'; }   // paths to the shop doors
  for (let r = 6; r <= 7; r++) g[r][4].type = 'path';

}

// --- FX helpers (map coordinates)

function update(dt) {

    case 'title':
      if (pressed.has('a')) { initAudio(); newGame(); mode = 'play'; SFX.coin(); }
      else if (pressed.has('pause')) openMenu('title');

    case 'play': updatePlay(dt); break;
    case 'menu': updateMenu(); break;

        S.day++; S.time = DAY_LEN; S.crows = []; S.zombies = []; S.crowT = 8; S.zombieT = 20; mode = 'play'; SFX.coin();
        S.threat = threatLevel(); S.player.goal = null;

      }

    i = (i + n + SEED_ORDER.length) % SEED_ORDER.length;

function updatePlay(dt) {
  if (pressed.has('pause')) { openMenu('play'); return; }
  const P = S.player;
  if (pressed.has('b')) cycleSeed(1);

  }

function playClick(ck) {

  S.clickFx = { x: mx, y: my, life: 0.4, col: ck.btn === 2 ? 11 : 16 };
  if (ck.btn === 2) {                                   // right click: attack
    let z = null, bd = 13;
    for (const e of S.zombies) if (!e.guard && !e.dead) { const d = Math.hypot(e.x - mx, (e.y - 7) - my); if (d < bd) { bd = d; z = e; } }
    if (z) P.goal = { kind: 'attack', z, t: 0 };

    return;

  const c = Math.floor(mx / TILE), r = Math.floor(my / TILE), t = tileAt(c, r);
  if (!t) return;
  let tc = c, tr = r;
  if (BUILDINGS[t.type]) [tc, tr] = BUILDINGS[t.type].door;
  const tt = S.map[tr][tc].type;
  const near = Math.hypot(tcx(c) - P.x, tcy(r) - (P.y - 3)) < 26;
  if (tt === 'soil' || tt === 'shed' || tt === 'stall' || tt === 'boutique' || (tt === 'grass' && near)) setTileGoal(tc, tr);

const SHOP_BOX = { x: (W - 236) >> 1, y: (H - 146) >> 1, w: 236, h: 146 };

function shopClick(ck) {

function handleClicks() {

// --- Threat: every 30s more enemies, and new bird types join
function threatLevel() { return (S.day - 1) + Math.floor((DAY_LEN - Math.max(0, S.time)) / THREAT_EVERY); }
function announceThreat(th) {
  SFX.alarm(); shake(0.2, 1);

  for (const k in BIRDS) if (BIRDS[k].unlock && th >= BIRDS[k].unlock && !S.seen[k]) {
    S.seen[k] = true;

  }

}
function pickBirdType() {
  const opts = [['crow', 4]];

  if (S.threat >= BIRDS.pink.unlock) opts.push(['pink', 0.6 + S.threat * 0.4]);
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
  for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }

function ripen(crop, c, r) {

    crop.result = roll < (lucky ? 0.62 : 0.82) ? pick(COMMONS) : pickRare();
  } else {
    crop.result = Math.random() < (lucky ? 0.12 : 0.04) ? pickRare() : crop.kind;

function harvest(t, c, r) {

// --- Crows: fly in and peck growing crops unless you (or a guardian) shoo them
function updateCrows(dt) {
  S.crowT -= dt;
  if (S.crowT <= 0) {
    S.crowT = (Math.max(1.8, 9 - S.threat * 0.9) + Math.random() * 2) * diff().spawn;
    const targets = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const cr = S.map[r][c].crop;
      if (cr && !cr.withered && cr.stage >= 1 && !cr.targeted) targets.push({ c, r, crop: cr });
    }
    if (targets.length && S.crows.filter(k => k.state !== 'flee').length < Math.min(8, 1 + S.threat)) {
      const tg = pick(targets), left = Math.random() < 0.5;
      tg.crop.targeted = true;
      S.crows.push({ type: pickBirdType(), x: left ? -12 : COLS * TILE + 12, y: 10 + Math.random() * (ROWS * TILE - 20), state: 'fly',
        tc: tg.c, tr: tg.r, crop: tg.crop, peckT: 0, t: 0, vx: 0, vy: 0, flash: 0 });

    }
  }
  const P = S.player;
  for (const k of S.crows) {
    k.t += dt; k.flash -= dt;
    const tile = S.map[k.tr][k.tc];
    const lost = !tile || tile.crop !== k.crop || k.crop.withered;
    if (k.state !== 'flee' && lost) flee(k, false);
    if (k.state === 'fly') {
      const tx = tcx(k.tc), ty = tcy(k.tr) + 2, ddx = tx - k.x, ddy = ty - k.y, d = Math.hypot(ddx, ddy);
      k.vx = ddx;
      if (d < 2) { k.state = 'peck'; k.x = tx; k.y = ty; SFX.crow(); }
      else { const sp = BIRDS[k.type].speed; k.x += ddx / d * sp * dt; k.y += ddy / d * sp * dt; }
    } else if (k.state === 'peck') {
      k.peckT += dt;
      if (Math.random() < dt * 6) burst(k.x, k.y - 2, [9, 8], 1, 20);
      const B = BIRDS[k.type];
      if (k.peckT >= B.eat * diff().eat) {
        if (B.poison) {
          tile.crop = null; tile.poison = true; tile.wet = false;
          popup(k.x, k.y - 12, 'POISONED!', 17); SFX.poison(); burst(k.x, k.y, [17, 14], 14, 35);
          toast('POISONED SOIL: NO PLANTING THERE TODAY');
        } else { k.crop.withered = true; popup(k.x, k.y - 12, 'EATEN!', 11); SFX.eaten(); }
        shake(0.2, 1);
        flee(k, false);
      }
    } else {
      k.x += k.vx * dt; k.y += k.vy * dt;
    }
    if (k.state !== 'flee' && Math.hypot(P.x - k.x, (P.y - 6) - k.y) < 18) {
      flee(k, true);
      const rw = BIRDS[k.type].reward;
      S.gold += rw; S.score += rw * 2; k.flash = 0.2;

      burst(k.x, k.y - 2, [1, 15], 10, 50, 40);
      SFX.scare(); shake(0.12, 1);

}
function flee(k, scared) {
  if (k.crop) k.crop.targeted = false;
  k.state = 'flee';
  k.vx = (k.x < COLS * TILE / 2 ? -1 : 1) * (scared ? 110 : 80);
  k.vy = -60;
}

// --- Zombies: shamble slowly to the nearest crop and eat it; bump the farmer to steal gold
function spawnZombie() {
  const roll = Math.random();
  let x, y;
  if (roll < 0.4) { x = tcx(5 + ((Math.random() * (COLS - 11)) | 0)); y = ROWS * TILE + 8; }   // bottom fence
  else if (roll < 0.7) { x = tcx(5 + ((Math.random() * (COLS - 11)) | 0)); y = -2; }          // top fence
  else { x = -8; y = tcy(9 + ((Math.random() * 4) | 0)); }                                    // left fence
  S.zombies.push({ x, y, hp: diff().zhp, maxHp: diff().zhp, t: Math.random() * 5, eatT: 0, target: null, flash: 0, frozen: 0,
    kx: 0, ky: 0, guard: false, life: 0, atkT: 0, dir: 1, face: 'front', moving: true, dead: false });
  SFX.groan();
}
function nearestCrop(z) {
  let best = null, bd = 1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cr = S.map[r][c].crop;
    if (!cr || cr.withered) continue;
    const d = Math.hypot(tcx(c) - z.x, tcy(r) - z.y);
    if (d < bd) { bd = d; best = { c, r, crop: cr }; }
  }
  return best;
}
function stepToward(z, tx, ty, sp, dt) {
  const dx = tx - z.x, dy = ty - z.y, d = Math.hypot(dx, dy);
  if (d < 0.5) { z.moving = false; return d; }
  z.x += dx / d * sp * dt; z.y += dy / d * sp * dt; z.moving = true;
  if (Math.abs(dx) > Math.abs(dy)) { z.face = 'side'; z.dir = dx > 0 ? 1 : -1; } else z.face = 'front';
  return d;
}
function updateZombies(dt) {
  if (S.time < DAY_LEN - 15) S.zombieT -= dt;     // short grace period each morning
  if (S.zombieT <= 0) {
    S.zombieT = (Math.max(6, 24 - S.threat * 2.2) + Math.random() * 5) * diff().spawn;
    if (S.zombies.filter(z => !z.guard).length < Math.min(8, 1 + Math.ceil(S.threat * 0.7))) spawnZombie();
  }
  const P = S.player;
  for (const z of S.zombies) {
    if (z.dead) continue;
    z.t += dt; z.flash -= dt;
    if (z.kx || z.ky) {
      z.x += z.kx * dt; z.y += z.ky * dt;
      const f = Math.pow(0.003, dt); z.kx *= f; z.ky *= f;
      if (Math.abs(z.kx) < 1 && Math.abs(z.ky) < 1) z.kx = z.ky = 0;
    }
    z.x = Math.max(-10, Math.min(COLS * TILE + 10, z.x));
    z.y = Math.max(-6, Math.min(ROWS * TILE + 10, z.y));
    if (z.guard) { updateGuardian(z, dt); continue; }
    if (z.frozen > 0) { z.frozen -= dt; z.moving = false; continue; }

    if (!z.target || z.target.crop.withered || S.map[z.target.r][z.target.c].crop !== z.target.crop) {
      z.target = nearestCrop(z); z.eatT = 0;
    }
    if (z.target) {
      const d = Math.hypot(tcx(z.target.c) - z.x, tcy(z.target.r) + 3 - z.y);
      if (d < 3) {
        z.moving = false; z.eatT += dt;
        if (Math.random() < dt * 5) burst(z.x, z.y - 4, [9, 8], 1, 20);
        if (z.eatT >= 3.5) {
          z.target.crop.withered = true;
          popup(z.x, z.y - 20, 'EATEN!', 11); SFX.eaten(); shake(0.15, 1);
          z.target = null; z.eatT = 0;
        }
      } else stepToward(z, tcx(z.target.c), tcy(z.target.r) + 3, ZOMBIE_SPEED, dt);
    } else stepToward(z, P.x, P.y, ZOMBIE_SPEED, dt);

    if (P.hurtCD <= 0 && Math.hypot(P.x - z.x, P.y - z.y) < 10) hurtPlayer(z);
    if (Math.random() < dt * 0.06) SFX.groan();
  }
  S.zombies = S.zombies.filter(z => !z.dead);
}
function hurtPlayer(z) {
  const P = S.player;
  P.hurtCD = 1.2; P.stun = 0.35; P.flash = 0.6;
  const a = Math.atan2(P.y - z.y, P.x - z.x);
  P.kbx = Math.cos(a) * 130; P.kby = Math.sin(a) * 130;
  const lost = Math.min(3, S.gold); S.gold -= lost;
  popup(P.x, P.y - 22, lost ? '-' + lost + 'G' : 'OUCH!', 11);
  SFX.hurt(); shake(0.25, 2);
}
function attack(z) {
  const P = S.player, sh = SHOVELS[S.shovel], d = DIRS[P.dir];
  P.tool = 'shovel'; P.actT = 0.25; useStamina();
  z.hp -= sh.dmg; z.flash = 0.15;
  const kb = sh.kb || 60; z.kx = d[0] * kb; z.ky = d[1] * kb;
  if (sh.freeze) { z.frozen = sh.freeze; burst(z.x, z.y - 6, [16, 15], 10, 30, 40); }
  SFX.hit(); shake(0.1, 1); burst(z.x, z.y - 6, [6, 5, 11], 6, 40);
  if (z.hp <= 0) killZombie(z);
}
function killZombie(z) {
  S.gold += 4; S.score += 6; S.kills++;
  popup(z.x, z.y - 20, '+4G', 10);
  burst(z.x, z.y - 6, [6, 5, 15, 1], 18, 55);
  SFX.zdie(); shake(0.2, 2);
  if (SHOVELS[S.shovel].guard) {
    z.guard = true; z.life = 40; z.hp = ZOMBIE_HP; z.target = null; z.frozen = 0; z.kx = z.ky = 0;
    popup(z.x, z.y - 28, 'GUARDIAN!', 9); SFX.guard(); burst(z.x, z.y - 6, [9, 10], 14, 40);
  } else z.dead = true;
}
// Guardians (Necro shovel): chase off crows and fight zombies, then crumble
function updateGuardian(z, dt) {
  const P = S.player;
  z.life -= dt;
  if (z.life <= 0) { z.dead = true; burst(z.x, z.y - 6, [9, 8, 3], 14, 40); popup(z.x, z.y - 20, 'RESTS', 7); return; }
  let best = null, bd = 150;
  for (const e of S.zombies) if (!e.guard && !e.dead) { const d = Math.hypot(e.x - z.x, e.y - z.y); if (d < bd) { bd = d; best = e; } }
  for (const k of S.crows) if (k.state !== 'flee') { const d = Math.hypot(k.x - z.x, k.y - z.y); if (d < bd) { bd = d; best = k; } }
  if (!best) {
    if (Math.hypot(P.x - z.x, P.y - z.y) > 26) stepToward(z, P.x, P.y, 24, dt); else z.moving = false;
    return;
  }
  if (bd < 12) {
    z.moving = false; z.atkT -= dt;
    if (z.atkT <= 0) {
      z.atkT = 0.8;
      if (best.hp !== undefined) {
        best.hp--; best.flash = 0.15; SFX.hit(); burst(best.x, best.y - 6, [6, 5], 5, 30);
        if (best.hp <= 0) killZombie(best);
      } else {
        flee(best, true); popup(best.x, best.y - 12, 'SHOO!', 9); SFX.scare();
      }
    }
  } else stepToward(z, best.x, best.y, 26, dt);

// --- Shops
function itemInfo(it) {
  const o = { icon: null, name: '', cost: 0, owned: false, afford: true, right: '', rightCol: 7, desc: '' };
  if (it.kind === 'seed') {
    const d = CROPS[it.id];
    o.icon = SPR.ripe[it.id]; o.name = d.name + ' SEED'; o.cost = d.cost; o.right = 'HAVE ' + S.seeds[it.id];
    o.desc = it.id === 'mystery' ? 'RISKY: DUD, COMMON CROP OR RARE (UP TO 200G)'
      : (d.fruit ? 'FRUIT. ' : '') + 'GROWS ' + d.grow + 'S - SELLS ' + d.sell + 'G - 4% RARE';
  } else if (it.kind === 'shovel') {
    const d = SHOVELS[it.id];
    o.icon = SPR.shovel[it.id]; o.name = d.name; o.cost = d.cost; o.owned = S.shovels.includes(it.id);
    o.right = S.shovel === it.id ? 'EQUIPPED' : o.owned ? 'OWNED' : d.rarity;
    o.rightCol = (o.owned) ? 16 : d.rc;
    o.desc = d.rarity + ': ' + d.desc;
  } else if (it.kind === 'hat') {
    const d = HATS[it.id];
    o.icon = SPR.hat[it.id]; o.name = d.name; o.cost = d.cost; o.owned = SAVE.hats.includes(it.id);
    o.right = o.owned ? (SAVE.hat === it.id ? 'WEARING' : 'OWNED') : 'CLOTHES';
    o.desc = o.owned ? 'A: WEAR OR TAKE OFF' : 'CLOTHES ARE YOURS FOREVER, EVEN AFTER GAME OVER';
  } else if (it.kind === 'outfit') {
    const d = OUTFITS[it.id];
    o.icon = SPR.shirt[it.id]; o.name = d.name; o.cost = d.cost; o.owned = SAVE.outfits.includes(it.id);
    o.right = o.owned ? (SAVE.outfit === it.id ? 'WEARING' : 'OWNED') : 'CLOTHES';
    o.desc = o.owned ? 'A: WEAR OR TAKE OFF' : 'CLOTHES ARE YOURS FOREVER, EVEN AFTER GAME OVER';
  } else {
    const d = BOOSTS[it.id];
    o.icon = SPR.potion[it.id]; o.name = d.name; o.cost = d.cost; o.owned = !!S.boosts[it.id];
    o.right = o.owned ? 'ACTIVE' : 'BOOST'; o.rightCol = o.owned ? 9 : 7;
    o.desc = o.owned ? 'ACTIVE UNTIL THE END OF TODAY' : d.desc;
  }
  o.afford = o.owned || S.gold >= o.cost;
  return o;
}
function buy(it) {
  const info = itemInfo(it);
  if (it.kind === 'seed') {
    if (S.gold >= info.cost) { S.gold -= info.cost; S.seeds[it.id]++; S.sel = SEED_ORDER.indexOf(it.id); SFX.coin(); } else SFX.error();
  } else if (it.kind === 'shovel') {
    if (info.owned) { S.shovel = it.id; SFX.select(); }
    else if (S.gold >= info.cost) { S.gold -= info.cost; S.shovels.push(it.id); S.shovel = it.id; SFX.rare(); }
    else SFX.error();
  } else if (it.kind === 'hat' || it.kind === 'outfit') {
    const list = it.kind === 'hat' ? SAVE.hats : SAVE.outfits, key = it.kind === 'hat' ? 'hat' : 'outfit';
    if (info.owned) { SAVE[key] = SAVE[key] === it.id ? null : it.id; SFX.select(); writeSave(); }
    else if (S.gold >= info.cost) { S.gold -= info.cost; list.push(it.id); SAVE[key] = it.id; writeSave(); SFX.rare(); }
    else SFX.error();
  } else {
    if (info.owned) SFX.error();
    else if (S.gold >= info.cost) { S.gold -= info.cost; S.boosts[it.id] = true; SFX.coin(); }
    else SFX.error();
  }
}
function updateShop() {
  const items = SHOPS[S.shop].items, n = items.length;
  if (wheelQ) {
    S.shopScroll = Math.max(0, Math.min(Math.max(0, n - SHOP_ROWS), S.shopScroll + wheelQ));
    S.shopIdx = Math.max(S.shopScroll, Math.min(S.shopScroll + SHOP_ROWS - 1, S.shopIdx));
  }
  if (mouse.moved) { const i = shopRowAt(mouse.x, mouse.y); if (i >= 0) S.shopIdx = i; }
  if (pressed.has('up')) { S.shopIdx = (S.shopIdx + n - 1) % n; SFX.select(); }
  if (pressed.has('down')) { S.shopIdx = (S.shopIdx + 1) % n; SFX.select(); }
  if (S.shopIdx < S.shopScroll) S.shopScroll = S.shopIdx;
  if (S.shopIdx >= S.shopScroll + SHOP_ROWS) S.shopScroll = S.shopIdx - SHOP_ROWS + 1;
  if (pressed.has('b') || pressed.has('pause')) { mode = 'play'; return; }
  if (pressed.has('a')) buy(items[S.shopIdx]);
}

function endDay() {
  for (const row of S.map) for (const t of row) { t.poison = false; if (t.crop) t.crop.targeted = false; }
  S.crows = []; S.zombies = []; S.boosts = {}; S.player.goal = null;
  const rent = rentFor(S.day);
  if (S.gold >= rent) {
    S.gold -= rent; S.paid = rent;
    if (S.day >= MAX_DAYS) { finishRun(); mode = 'win'; SFX.rare(); }
    else { mode = 'dayend'; SFX.day(); }
  } else {
    gameOver('EVICTED!', "COULDN'T PAY " + rent + 'G RENT');
  }
}
function finishRun() {
  S.newBest = S.score > SAVE.best;
  if (S.newBest) { SAVE.best = S.score; writeSave(); }
}
function gameOver(reason, sub) {
  S.overReason = reason; S.overSub = sub;
  finishRun(); mode = 'over'; SFX.over(); shake(0.5, 3);

function updateFx(dt) {

  const item = menuItems()[row];
  if (item.value !== undefined && ck.x >= L.x + 120) menuAdjust(item, ck.x < L.x + 120 + (L.w - 120) / 2 ? -1 : 1);
  else menuActivate(item);
}
function updateMenu() {
  if (menuView === 'controls') {
    if (pressed.has('a') || pressed.has('b') || pressed.has('pause')) { menuView = 'main'; SFX.select(); }
    return;
  }
  const items = menuItems(), n = items.length;
  if (menuIdx >= n) menuIdx = n - 1;
  if (pressed.has('up')) { menuIdx = (menuIdx + n - 1) % n; SFX.select(); }
  if (pressed.has('down')) { menuIdx = (menuIdx + 1) % n; SFX.select(); }
  if (pressed.has('left')) menuAdjust(items[menuIdx], -1);
  if (pressed.has('right')) menuAdjust(items[menuIdx], 1);
  if (mouse.moved) { const i = menuRowAt(mouse.x, mouse.y); if (i >= 0) menuIdx = i; }
  if (pressed.has('a')) menuActivate(items[menuIdx]);
  else if (pressed.has('pause') || pressed.has('b')) closeMenu();
}
const CONTROL_LINES = [
  ['KEYBOARD', 10], ['WASD / ARROWS   MOVE', 16], ['SPACE / ENTER   ACTION, HARVEST, ATTACK', 16],
  ['Q / E   CHANGE SEED      1-5   PICK SEED', 16], ['P / ESC   MENU      M   MUTE', 16], ['', 16],
  ['MOUSE', 10], ['LEFT CLICK   MOVE, FARM, HARVEST, SHOP', 16], ['RIGHT CLICK   ATTACK (HOLD TO KEEP SWINGING)', 16],
  ['WHEEL   SCROLL SHOP LISTS', 16], ['', 16],
  ['STAMINA: EVERY SWING COSTS ONE LEVEL.', 7], ['AT ZERO YOU MOVE AT HALF SPEED UNTIL IT REFILLS.', 7],
];
function drawMenu() {
  ctx.globalAlpha = 0.6; R(0, 0, W, H, 1); ctx.globalAlpha = 1;
  const L = menuLayout();
  drawBox(L.x, L.y, L.w, L.h);
  if (menuView === 'controls') {
    text('CONTROLS', L.x + 10, L.y + 8, 10, 2);
    CONTROL_LINES.forEach(([t, c], i) => text(t, L.x + 12, L.y + 28 + i * 10, c));
    text(isTouch ? 'TAP TO GO BACK' : 'CLICK OR ESC TO GO BACK', L.x + 12, L.y + L.h - 12, 7);
    return;
  }
  text(menuFrom === 'title' ? 'SETTINGS' : 'PAUSED', L.x + 10, L.y + 8, 10, 2);
  menuItems().forEach((it, i) => {
    const y = L.y + 26 + i * 14, sel = i === menuIdx;
    if (sel) R(L.x + 4, y - 3, L.w - 8, 11, 3);
    text((sel ? '> ' : '  ') + it.label, L.x + 8, y, sel ? 16 : 7);
    if (it.value !== undefined) {
      const vx = L.x + 120, col = it.locked ? 13 : 10;
      text('<', vx, y, it.locked ? 13 : 16);
      text(it.value, vx + 10, y, col);
      if (it.id === 'volume') { R(vx + 32, y, 62, 5, 1); R(vx + 33, y + 1, Math.round(60 * SAVE.volume), 3, SAVE.muted ? 13 : 9); }
      text('>', L.x + L.w - 14, y, it.locked ? 13 : 16);
    }
  });
  text(isTouch ? 'D-PAD: CHANGE   A: SELECT   B: BACK' : 'ARROWS/CLICK: CHANGE   ENTER: SELECT   ESC: BACK', L.x + 10, L.y + L.h - 12, 7);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  R(0, 0, W, H, 1);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = Math.round((Math.random() * 2 - 1) * shakeMag); sy = Math.round((Math.random() * 2 - 1) * shakeMag); }
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  if (mode === 'title' || (mode === 'menu' && menuFrom === 'title')) {
    drawWorld(titleMap, false);
    drawTitle();
  } else {
    drawWorld(S.map, true);
    drawHUD();
    if (mode === 'play') drawToast();
    if (mode === 'shop') drawShop();
    if (mode === 'dayend') drawCenterPanel([
      { t: 'DAY ' + S.day + ' DONE', c: 10, s: 2, gap: 8 },
      { t: 'RENT PAID: ' + S.paid + 'G' },
      { t: 'GOLD LEFT: ' + S.gold + 'G' },
      { t: 'TOMORROW\'S RENT: ' + rentFor(S.day + 1) + 'G', c: 11, gap: 9 },
      { t: isTouch ? 'TAP A FOR THE NEXT DAY' : 'PRESS ENTER FOR THE NEXT DAY', c: 7 }], 78);
    if (mode === 'over') drawCenterPanel([
      { t: S.overReason, c: 11, s: 2, gap: 8 },
      { t: S.overSub },
      { t: 'SCORE ' + S.score + '   DAY ' + S.day + '/' + MAX_DAYS + '   ZOMBIES ' + S.kills },
      { t: S.newBest ? 'NEW BEST SCORE!' : 'BEST ' + SAVE.best, c: S.newBest ? 10 : 7, gap: 9 },
      { t: isTouch ? 'TAP A TO CONTINUE' : 'PRESS ENTER TO CONTINUE', c: 7 }], 78);
    if (mode === 'win') drawCenterPanel([
      { t: 'FARM SAVED!', c: 10, s: 2, gap: 8 },
      { t: 'ALL ' + MAX_DAYS + ' RENTS PAID' },
      { t: 'SCORE ' + S.score + '   RARES ' + S.rares + '   ZOMBIES ' + S.kills },
      { t: S.newBest ? 'NEW BEST SCORE!' : 'BEST ' + SAVE.best, c: S.newBest ? 10 : 7, gap: 9 },
      { t: isTouch ? 'TAP A TO CONTINUE' : 'PRESS ENTER TO CONTINUE', c: 7 }], 78);
  }
  if (mode === 'menu') drawMenu();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* =========================================================
   MAIN LOOP (fixed timestep)
   ========================================================= */
loadSave();
applyAudio();
buildSprites();
titleMap = buildTitleMap();
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= STEP) { update(STEP); pressed.clear(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
grabFocus();
cvs.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && document.activeElement !== cvs) grabFocus(); });
</script>
